[tool.setuptools]
py-modules = ["streamlit_pandasai_chatbot", "pandasai_helper"]

[tool.setuptools.packages.find]
exclude = [
    "logs*",
    "exports*",
    "datasets*",
    "ctrpData*",
    "gdscData*",
    "ccleData*",
    "output_csvs*",
    "mdaMillsData*",
    "uniSarcomaData*",
    "nciSarcomaData*",
    "rcellminerUtilsCDB*",
    "_structures*",
    "__pycache__*"
]
