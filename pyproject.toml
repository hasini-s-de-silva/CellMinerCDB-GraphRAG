    "sniffio==1.3.1",
    "sqlalchemy==2.0.41",
    "sqlglot==25.34.1",
    "sqlglotrs==0.3.0",
    "streamlit==1.46.1",
    "tenacity==9.1.2",
    "threadpoolctl==3.6.0",
    "toml==0.10.2",
    "tomli==2.2.1",
    "tornado==6.5.1",
