[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cellminercdb-pandasai"
version = "0.1.0"
description = "AI-powered cancer cell line data analysis platform combining CCLE and GDSC databases with PandasAI"
requires-python = "==3.11.*"
dependencies = [
    "altair==5.5.0",
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "astor==0.8.1",
    "attrs==25.3.0",
    "blinker==1.9.0",
    "cachetools==6.1.0",
    "certifi==2025.6.15",
    "charset-normalizer==3.4.2",
    "click==8.2.1",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "distro==1.9.0",
    "dnspython==2.7.0",
    "dotenv==0.9.9",
    "exceptiongroup==1.3.0",
    "faker==19.13.0",
    "fastjsonschema==2.21.1",
    "flashtext==2.7",
    "fonttools==4.58.4",
    "gitdb==4.0.12",
    "gitpython==3.1.44",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
