    "jsonschema-specifications==2025.4.1",
    "kiwisolver==1.4.8",
    "markupsafe==3.0.2",
    "matplotlib==3.7.5",
    "narwhals==1.44.0",
    "numpy==1.26.4",
    "networkx==3.4.2",
    "openai==1.82.0",
    "packaging==25.0",
    "pandas==2.3.0",
    "pandasai==3.0.0b17",
    "pandasai-openai==0.1.5",
    "pandasai-sql==0.1.7",
    "pillow==10.4.0",
    "protobuf==6.31.1",
    "psycopg2-binary==2.9.10",
    "pyarrow==14.0.2",
    "pydantic==2.11.7",
    "pydantic-core==2.33.2",
